/* Base Button Setup */
.btn {
    /* default btn color. Change on usage via style="--btn-color: var(--color-yellow-600)" */
    --btn-color: var(--color-blue-600, #0d6efd);

    background-color: transparent;
    color: var(--btn-color, currentColor);
    border: 1px solid var(--btn-color, currentColor);
    transition: 0.3s;
}

.btn:focus, .btn:hover {
    background-color: var(--btn-color, currentColor);
    color:  #fff;
    border-color: var(--btn-color, currentColor);
}

.btn {
    display: inline-block;
    border: 1px solid ;
    cursor: pointer;
    text-align: center;
}

.btn {
    padding: 7px 10px 5px 10px;  /* Vertical centered. 8px to correct text height */
    font-size: 16px;
    border-radius: 3px;
}

function determineDifficulty(problem) {
    if (window.operator == "plus" || window.operator == "minus") {
        return determineDifficultyPlus(problem);
    }

    if (window.operator == "multiply" || window.operator == "divide") {
        return determineDifficultyMultiply(problem);
    }
}

function determineDifficultyPlus(problem) {
    // machine learning based difficulty determination for plus problems
    const numberRange = window.numberRange;
    const rangeMap = { '5': 1/8, '10': 2/8, '20': 3/8, '50': 4/8, '100': 5/8, '200': 6/8, '500': 7/8, '1000': 1 };
    const inputVector = {
        range: rangeMap[numberRange],
        a: problem.a / parseInt(numberRange),
        b: problem.b / parseInt(numberRange),
    };

    let net = new brain.NeuralNetwork();
    net.fromJSON(trainedWeights_Plus);
    let output = net.run(inputVector)
    let values = [output.d1, output.d2, output.d3];
    // get the index of the highest output value
    output = values.indexOf(Math.max(...values))
    
    let difficulty = [1,2,3][output]

    return difficulty;
}

function determineDifficultyMultiply(problem) {
        // based on single factors
        if (problem.a == 0 || problem.b == 0 ||
            problem.a == 1 || problem.b == 1 ||
            problem.a == 2 || problem.b == 2 ||
            problem.a == 5 || problem.b == 5 ||
            problem.a == 10 || problem.b == 10 ||
            problem.a == 11 || problem.b == 11 ||
            problem.a == 20 || problem.b == 20 ||
            problem.a == 30 || problem.b == 30 ||
            problem.a == 40 || problem.b == 40 ||
            problem.a == 50 || problem.b == 50
        ) {
            return 1;}

        // based on combination of factors
        if ((problem.a == 3 && problem.b == 25) ||
            (problem.a == 25 && problem.b == 3) ||
            (problem.a == 4 && problem.b == 25) ||
            (problem.a == 25 && problem.b == 4)
        ) {
            return 1;
        }

        let range = window.numberRange;
        if (range == "5" || range == "10" || range == "20") {
            return 1;
        }
        if (range == "50" || range == "100") {
            if (problem.a > 11 || problem.b > 11) 
                return 3;
            if (problem.a > 7 || problem.b > 7)
                return 2;
            return 1;
        }
}

function generate_Plus_10() {
    let maxNumber = 10
    let a = Math.floor(Math.random() * maxNumber);
    let b = Math.floor(Math.random() * (maxNumber - a));
    let result = a + b;
    return { a: a, b: b, result: result };
}

function getAufgabenSet() {
    let ret = [];
    let newProblem = null;
    let lastProblem = null;
    for (let i = 0; i < window.NumberProglemsPerSession; i++) {
        newProblem = generateAufgabe();
        if (lastProblem && newProblem.a === lastProblem.a && newProblem.b === lastProblem.b)
            i--; // retry if the new problem is identical to the last one
        else {
            ret.push(newProblem);
            lastProblem = ret[ret.length - 1];
        }
    }
    return ret;
}

function generateAufgabe() {
    let ret = {}
    if (window.operator === "plus")
        ret = generateAufgabePlus()
    if (window.operator === "minus")
        ret = generateAufgabeMinus()
    if (window.operator === "multiply")
        ret = generateAufgabeMultiply()
    if (window.operator === "divide")
        ret = generateAufgabeDivide()
    return ret;
}

function generateAufgabePlus() {
    // random Aufgaabe from 1 to maxNumber
    let a = Math.floor((1 - Math.random()) * (window.maxNumber-1)) + 1;
    let newMaxNumber = window.maxNumber - a;
    let b = Math.floor((1 - Math.random()) * newMaxNumber) + 1;

    let result = a + b;
    return { a: a, b: b, result: result, difficulty: determineDifficulty({a: a, b: b})};
}

function generateAufgabeMinus() {

    let PlusProblem = generateAufgabePlus();
    let CoinFlip = Math.random() < 0.5;
    if (CoinFlip)
        return { a: PlusProblem.result, b: PlusProblem.a, result: PlusProblem.b, difficulty: PlusProblem.difficulty};
    return { a: PlusProblem.result, b: PlusProblem.b, result: PlusProblem.a, difficulty: PlusProblem.difficulty};
}

function generateAufgabeMultiply() {
    let problems = AUFGABENTABELLE["multiply"][window.numberRange];
    // expand: problems with higher weight appear more frequently
    let expandedProblems = [];
    for (let p of problems) {
        for (let i = 0; i < p.weight; i++) {
            expandedProblems.push(p);
        }
    }
    let problem = expandedProblems[Math.floor(Math.random() * expandedProblems.length)];


    let CoinFlip = Math.random() < 0.5;
    if (CoinFlip)
        return { a: problem.b, b: problem.a, result: problem.result, difficulty: determineDifficulty({a: problem.b, b: problem.a})};
    return { a: problem.a, b: problem.b, result: problem.result, difficulty: determineDifficulty({a: problem.a, b: problem.b})};
}

function generateAufgabeDivide() {
    let mP = generateAufgabeMultiply();

    let CoinFlip = Math.random() < 0.5;
    if (CoinFlip)
        return { a: mP.result, b: mP.b, result: mP.a, difficulty: mP.difficulty};
    return { a: mP.result, b: mP.b, result: mP.a, difficulty: mP.difficulty };
}


 function _operator(operator) {
     if (operator === "plus") return "+";
     if (operator === "minus") return "-";
     if (operator === "multiply") return "x";
     if (operator === "divide") return "÷";
     return "";
 }
function FromProblemTable(operator, maxNumber) {
    let pairs = [];
    if (mathfitData[operator] === undefined) return [null, null]
    if (mathfitData[operator][maxNumber] === undefined) return [null, null]

    // Generate the list with factors
    mathfitData[operator][maxNumber].forEach(item => {
        let factor = item.factor || 1;
        for (let i = 0; i < factor; i++) {
            pairs.push([item.num1, item.num2]);
        }
    });

    // Choose a random pair
    let randomPair = pairs[Math.floor(Math.random() * pairs.length)];

    // 50% chance to switch the order
    if (Math.random() < 0.5) return [randomPair[1], randomPair[0]]
    return randomPair
        
}

function appendToResult(content) {
    let resultElement = document.getElementById("result");
    if (resultElement.style.color === "var(--color-incorrect)") {
        resultElement.style.color = "";
        resultElement.firstElementChild.textContent = "";
    }

    if (resultElement.textContent.length > 4) {
        ErrorShake(resultElement);
        return;
    }
    resultElement.firstElementChild.textContent += content;
}

function clearResult() {
    let resultElement = document.getElementById("result");
    resultElement.firstElementChild.textContent = "";
}

async function checkResult() {
    // get the user's answer and the current problem
    let resultElement = document.getElementById("result");
    let userAnswer = parseInt(resultElement.firstElementChild.textContent);
    let problem = window.ProblemsInGame[window.ProblemIndex];

    // update the progress bar
    let nextProgressSegment = document.querySelector('.progress-segment.is-pending');
    nextProgressSegment.classList.remove('is-pending');
    if (userAnswer === problem.result) {
        nextProgressSegment.classList.add('is-correct');
        SuccessJump(resultElement)
        let numberOfStars = problem.difficulty;
        for (let i = 0; i < numberOfStars; i++) {
            document.getElementById("collection-of-stars").innerHTML += WriteSVG("svg-star-filled");
        }
    } else {
        nextProgressSegment.classList.add('is-incorrect');
        ErrorShake(resultElement)
    }

    await new Promise(resolve => setTimeout(resolve, 500)); // Wait for the success jump animation to complete
    
    // if the user's answer is incorrect, stay on the current problem
    if (userAnswer !== problem.result) {
        return
    }

    if (window.ProblemIndex + 1 < window.ProblemsInGame.length) {
        WriteAufgabe();
    } else {
        startNewGame()
    }
}

function WriteSVG(id) {
    // find the svg with the id in the current document
    const svgElement = document.getElementById(id);
    if (svgElement) {
        return svgElement.outerHTML;
    }
    return "";
}

function ErrorShake(element, color = "var(--color-incorrect)") {
    element.classList.add("error-shake");
    if (color) {
        element.style.color = color;
    }
    setTimeout(() => {
        element.classList.remove("error-shake");
    }, 1000);
}

function SuccessJump(element, color = "var(--color-correct)") {
    element.classList.add("success-jump");
    if (color) {
        element.style.color = color;
    }
    setTimeout(() => {
        element.classList.remove("success-jump");
    }, 1000);
}
