/* Base Button Setup */
.btn {
    /* default btn color. Change on usage via style="--btn-color: var(--color-yellow-600)" */
    --btn-color: var(--color-blue-600, #0d6efd);

    background-color: transparent;
    color: var(--btn-color, currentColor);
    border: 1px solid var(--btn-color, currentColor);
    transition: 0.3s;
}

.btn:focus, .btn:hover {
    background-color: var(--btn-color, currentColor);
    color:  #fff;
    border-color: var(--btn-color, currentColor);
}

.btn {
    display: inline-block;
    border: 1px solid ;
    cursor: pointer;
    text-align: center;
}

.btn {
    padding: 7px 10px 5px 10px;  /* Vertical centered. 8px to correct text height */
    font-size: 16px;
    border-radius: 3px;
}

function selectScreen(element) {
    // switch to active screen
    const name = element.title.trim().toLowerCase();
    document.querySelectorAll('.screen').forEach(_screen => {
        _screen.classList.remove('active');
    });
    const targetScreen = document.getElementById('id-section-' + name.toLowerCase());
    if (targetScreen) {
        targetScreen.classList.add('active');
    }

    document.querySelectorAll('nav a').forEach(_navItem => {
        _navItem.classList.remove('active');
    });
    element.classList.add('active');
}


function selectGameScreen(element) {
    // switch to active screen
    document.querySelectorAll('.screen').forEach(_screen => {
        _screen.classList.remove('active');
    });
    document.getElementById("id-section-game").classList.add('active');
}

function changeLook() {
    const body = document.body;
    // body.className = `${window.theme} ${window.color}`;

    // Update the selected radio button based on the current color
    const homeRadios = document.querySelectorAll('\

window.AufgabenInSession = 8;
window.CurrentAufgabenIndex = 0;
window.AufgabenmHistory = [];

function startNewSession() {
    // Init session parameters
    window.operator = document.querySelector('input[name="name-operation"]:checked').value;
    window.numberRange = document.querySelector('input[name="name-number-range"]:checked').value;
    window.maxNumber = parseInt(window.numberRange.split('-')[1]);
    // Set Title
    document.querySelector('.problem-title').textContent = `${window.operator} | ${window.numberRange}`;
    
    // Progress bar initialization
    const progressSegments = document.querySelectorAll('.progress-segment');
    for (let segment of progressSegments) {
        segment.classList.remove('is-pending', 'is-correct', 'is-incorrect');
        segment.classList.add('is-pending');
    }
    
    // Initialize session history and counters
    window.AufgabenmHistory.push({
        index: window.AufgabenmHistory.length,
        aufgaben: []
    })
    window.AufgabenInSession = 8;
    window.CurrentAufgabenIndex = 0;
}
window.operator = "+";
window.numberRange = "1-10";
window.maxNumber = 10;
window.currentProblem = {};


function startGame() {
    startNewSession()

    generateAufgabe();

    selectScreen('game');
}

function generateAufgabe() {
    if (window.operator === "plus")
        window.currentProblem = generateAufgabePlus()
    if (window.operator === "minus")
        window.currentProblem = generateAufgabeMinus()
    if (window.operator === "multiply")
        window.currentProblem = generateAufgabeMultiply()
    if (window.operator === "divide")
        window.currentProblem = generateAufgabeDivide()

    document.getElementById("problem").innerHTML = window.currentProblem.a + " " + _operator(window.operator) + " " + window.currentProblem.b;
    document.getElementById("result").firstElementChild.textContent = "";
    document.getElementById("result").style.color = "";
}

function generateAufgabePlus() {
    let a = Math.floor(Math.random() * window.maxNumber);
    let b = Math.floor(Math.random() * (window.maxNumber - a));
    let result = a + b;
    return { a: a, b: b, result: result };
}

function generateAufgabeMinus() {
    let minNumber = 0;
    if (window.maxNumber == 20) minNumber = 10;
    if (window.maxNumber == 50) minNumber = 20;
    if (window.maxNumber == 100) minNumber = 50;
    let a = Math.floor(Math.random() * (window.maxNumber - minNumber)) + minNumber;
    let b = Math.floor(Math.random() * a);
    let result = a - b;
    return { a: a, b: b, result: result };
}
function generateAufgabeMultiply() {
    let problems = SubsetFrom_Aufgabentabelle()
    let randomProblem = problems[Math.floor(Math.random() * problems.length)];
    return randomProblem;
}

function generateAufgabeDivide() {
    let problems = SubsetFrom_Aufgabentabelle()
    let randomProblem = problems[Math.floor(Math.random() * problems.length)];
    return randomProblem;
}


 function _operator(operator) {
     if (operator === "plus") return "+";
     if (operator === "minus") return "-";
     if (operator === "multiply") return "x";
     if (operator === "divide") return "÷";
     return "";
 }


 function SubsetFrom_Aufgabentabelle() {
    let subset = AUFGABENTABELLE[window.operator];
    let minNumber = 0;
    if (window.maxNumber == 20) minNumber = 10;
    if (window.maxNumber == 50) minNumber = 20;
    if (window.maxNumber == 100) minNumber = 50;
    if (window.operator === "multiply") {
        subset = subset.filter(item =>  minNumber <= item.result && item.result <= window.maxNumber);
    }

    if (window.operator === "divide") {
        subset = subset.filter(item =>  minNumber <= item.a && item.a <= window.maxNumber 
            && item.b != 1);
    }
    return subset;
 }


function appendToResult(content) {
    let resultElement = document.getElementById("result");
    if (resultElement.style.color === "var(--color-incorrect)") {
        resultElement.style.color = "";
        resultElement.firstElementChild.textContent = "";
    }
    resultElement.firstElementChild.textContent += content;
}

function clearResult() {
    let resultElement = document.getElementById("result");
    resultElement.firstElementChild.textContent = "";
}

async function checkResult() {
    // get the user's answer and the current problem
    let resultElement = document.getElementById("result");
    let userAnswer = parseInt(resultElement.firstElementChild.textContent);
    let problem = window.currentProblem;

    // store the user's answer in the session history
    window.AufgabenmHistory[window.AufgabenmHistory.length - 1].aufgaben.push({ ...problem, userAnswer: userAnswer });
    window.CurrentAufgabenIndex += 1;

    // update the progress bar
    let nextProgressSegment = document.querySelector('.progress-segment.is-pending');
    nextProgressSegment.classList.remove('is-pending');
    if (userAnswer === problem.result) {
        nextProgressSegment.classList.add('is-correct');
        SuccessJump(resultElement)
        await new Promise(resolve => setTimeout(resolve, 500)); // Wait for the success jump animation to complete
        generateAufgabe();
    } else {
        nextProgressSegment.classList.add('is-incorrect');
        ErrorShake(resultElement)
    }

    if (window.CurrentAufgabenIndex >= window.AufgabenInSession) {
        startGame();
    }
}

function ErrorShake(element, color = "var(--color-incorrect)") {
    element.classList.add("error-shake");
    if (color) {
        element.style.color = color;
    }
    setTimeout(() => {
        element.classList.remove("error-shake");
    }, 1000);
}

function SuccessJump(element, color = "var(--color-correct)") {
    element.classList.add("success-jump");
    if (color) {
        element.style.color = color;
    }
    setTimeout(() => {
        element.classList.remove("success-jump");
    }, 1000);
